name: Execute JSON Script
on:
  schedule:
    - cron: '7 0,9,10,11,22,23 * * *'  # UTC时间对应北京时间+8
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    # 添加必要的权限以便推送提交
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 使用token以便后续推送
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run JavaScript script
        run: |
          echo "当前工作目录: $(pwd)"
          node run.js 
          if [ -f "extern_user.txt" ]; then
            echo "✅ extern_user.txt 文件生成成功"
            cat extern_user.txt
          else
            echo "❌ 文件生成失败！目录内容:"
            ls -la
            exit 1
          fi

      # ▼ 添加这个提交文件的步骤 ▼
      - name: Commit file
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add extern_user.txt
          # 检查是否有变化
          if git diff-index --quiet HEAD --; then
            echo "没有变化需要提交"
          else
            git commit -m "Auto-commit extern_user.txt"
            git push
          fi

      # 可选的：保留文件上传步骤
      - name: Upload extern_user as artifact
        uses: actions/upload-artifact@v4
        with:
          name: extern_user
          path: extern_user.txt
