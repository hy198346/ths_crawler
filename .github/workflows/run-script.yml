name: Execute JSON Script
on:
  schedule:
    - cron: '7 0,9,10,11,22,23 * * *'  # UTC时间对应北京时间+8
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # 添加深度克隆防止部分文件缺失
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run JavaScript script
        run: |
          # 显示当前路径（调试用）
          echo "当前工作目录: $(pwd)"
          # 执行脚本时强制指定工作目录
          node run.js 
          # 检查文件是否存在
          if [ -f "extern_user.txt" ]; then
            echo "✅ extern_user.txt 文件生成成功"
            cat extern_user.txt  # 显示文件内容验证
          else
            echo "❌ 文件生成失败！目录内容:"
            ls -la
            exit 1  # 故意失败以查看日志
          fi

      # 添加文件上传步骤（可选）
      - name: Upload extern_user
        uses: actions/upload-artifact@v4
        if: always()  # 即使失败也上传
        with:
          name: output-files
          path: extern_user.txt
