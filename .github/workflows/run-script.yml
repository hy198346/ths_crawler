name: Execute JSON Script
on:
  schedule:
    - cron: '21 0,9,10,11,22,23 * * *'  # UTC时间对应北京时间+8
  workflow_dispatch:

# 解决并发问题（同分支同时只允许一个任务运行）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 代码检出（明确指定分支）
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}  # 使用触发工作流的分支
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Node环境设置
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 安装依赖
      - name: Install dependencies
        run: npm ci --prefer-offline  # 更安全的安装方式

      # 4. 执行脚本
      - name: Run JavaScript script
        run: |
          node run.js 
          if [ -f "extern_user.txt" ]; then
            echo "✅ extern_user.txt 生成成功"
            cat extern_user.txt
          else
            echo "❌ 文件生成失败！目录内容:"
            ls -la
            exit 1
         
