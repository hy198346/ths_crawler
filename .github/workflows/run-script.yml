name: Execute JSON Script
on:
  schedule:
    - cron: '7 0,9,10,11,22,23 * * *'  # UTC时间对应北京时间+8
  workflow_dispatch:

# 解决并发问题（同分支同时只允许一个任务运行）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 代码检出（明确指定分支）
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}  # 使用触发工作流的分支
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Node环境设置
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 安装依赖
      - name: Install dependencies
        run: npm ci --prefer-offline  # 更安全的安装方式

      # 4. 执行脚本
      - name: Run JavaScript script
        run: |
          node run.js 
          if [ -f "extern_user.txt" ]; then
            echo "✅ extern_user.txt 生成成功"
            cat extern_user.txt
          else
            echo "❌ 文件生成失败！目录内容:"
            ls -la
            exit 1
          fi

      # 5. 提交变更（关键修复点）
      - name: Commit file
        run: |
          # 配置用户信息
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          
          # 检出到实际分支（解决分离头指针问题）
          git checkout -B ${GITHUB_REF#refs/heads/}
          
          # 添加并提交文件
          git add extern_user.txt
          
          # 避免空提交
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-commit extern_user.txt [skip ci]"
            git push origin HEAD:${GITHUB_REF#refs/heads/}
            echo "✅ 文件已提交"
          else
            echo "🟢 无变更可提交"
          fi

      # 6. 上传制品（保持不变）
      - name: Upload extern_user as artifact
        uses: actions/upload-artifact@v4
        with:
          name: extern_user
          path: extern_user.txt
