name: Execute JSON Script
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      # 删除 npm install 步骤
      
      - name: Run JavaScript script
        run: node run.js
      
      - name: Save output
        uses: actions/upload-artifact@v4
        with:
          name: script-output
          path: output.txt
          retention-days: 5
