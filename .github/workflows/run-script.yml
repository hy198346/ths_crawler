name: JSON Script Executor [Test Mode]
on:
  schedule: 
    - cron: '*/15 * * * *'  # 每5分钟运行一次（UTC时间）
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 调试信息 - 验证定时任务是否触发
      - name: Debug schedule trigger
        run: |
          echo "🕒 当前系统时间: $(date)"
          echo "⏰ 工作流触发方式: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "✅ 计划任务已触发"
            echo "Cron表达式: ${{ github.event.schedule }}"
          else
            echo "🖱️ 手动触发工作流"
          fi
      
      # 2. 代码检出
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # 3. Node环境设置
      - name: Generate lockfile if missing
        run: |
          if [ ! -f package-lock.json ]; then
            npm install
            echo "Generated package-lock.json"
          else
            echo "Lockfile exists"
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 4. 安装依赖
      - name: Install dependencies
        run: npm ci

      # 5. 执行脚本 (添加模拟文件创建)
      - name: Run JSON Script
        run: |
          # 模拟生成文件
          timestamp=$(date +"%Y%m%d-%H%M%S")
          echo "extern_user_${timestamp}" > extern_user.txt
          
          echo "📄 文件内容:"
          cat extern_user.txt
          
          echo "📁 目录结构:"
          ls -la

      # 6. 提交变更（添加详细日志）
      - name: Commit changes
        run: |
          # 配置Git
          git config user.name 'GitHub Actions Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          
          # 检查变更
          echo "🔍 Git 状态:"
          git status
          
          # 添加文件
          git add extern_user.txt
          
          # 尝试提交
          if git diff-index --quiet HEAD --; then
            echo "🟢 没有检测到变更，跳过提交"
          else
            echo "📝 检测到变更，准备提交..."
            git commit -m "定时更新: extern_user.txt @ ${{ github.run_id }}"
            git push origin HEAD:${{ github.ref }}
            echo "✅ 变更已提交到 ${{ github.ref }}"
          fi

      # 7. 上传制品
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extern_user_file
          path: extern_user.txt
          retention-days: 3

    
