name: Execute JSON Script
on:
  schedule:
    - cron: '7 9-23/2 * * *'  # UTC时间（对应北京时间8:07,17:07等）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: 设置时区（调试用）
        run: sudo timedatectl set-timezone UTC
      
      - name: 输出当前时间（调试）
        run: date
        
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run JavaScript script
        run: |
          echo "当前工作目录: $(pwd)"
          node run.js 
          if [ -f "extern_user.txt" ]; then
            echo "✅ extern_user.txt 文件生成成功"
          else
            echo "❌ 文件生成失败！"
            ls -la
            exit 1
          fi

      - name: Commit files
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          
          # 添加需要提交的文件
          git add extern_user.txt
          git add package-lock.json
          
          # 检查是否有变化
          if git diff --staged --quiet; then
            echo "⚠️ 没有变化需要提交"
          else
            git commit -m "Auto-commit: extern_user.txt and package-lock.json $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push origin HEAD:${{ github.ref }}
          fi
          
          # 调试输出
          echo "提交后状态:"
          git status
          echo "最近一次提交:"
          git log -1 --oneline

      # 新增：压缩文件
      - name: Compress extern_user.txt
        run: |
          if [ -f "extern_user.txt" ]; then
            gzip extern_user.txt
            echo "✅ 文件压缩成功: extern_user.txt.gz"
            ls -l extern_user.txt.gz
          else
            echo "❌ 压缩失败：extern_user.txt 文件不存在"
            exit 1
          fi

      # 修改：上传压缩后的文件
      - name: Upload extern_user as artifact (gzipped)
        uses: actions/upload-artifact@v4
        with:
          name: extern_user-${{ github.run_id }}.gz
          path: extern_user.txt.gz
          retention-days: 1  # 仅保留1天减少存储占用
