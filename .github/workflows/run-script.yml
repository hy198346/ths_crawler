name: Execute JSON Script
concurrency:
  group: ths-crawler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
    paths-ignore:
      - extern_user.txt.gz
      - extern_user_ann_cache.json
  pull_request:
    branches:
      - main
  schedule:
    - cron: '7 11,23 * * *'  # UTC时间（对应北京时间7:07,19:07等）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: 设置时区（调试用）
        run: sudo timedatectl set-timezone UTC
      
      - name: 输出当前时间（调试）
        run: date
        
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript script
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }} # 关键步骤
          TUNNEL_PROXY: ${{ secrets.TUNNEL_PROXY }}
          TUNNEL_USERNAME: ${{ secrets.TUNNEL_USERNAME }}
          TUNNEL_PASSWORD: ${{ secrets.TUNNEL_PASSWORD }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          ANNOUNCEMENT_SUMMARY_CHARS: ${{ secrets.ANNOUNCEMENT_SUMMARY_CHARS }}
          KIMI_DEBUG: ${{ secrets.KIMI_DEBUG }}
          ANNOUNCE_KIMI_TOP_N: ${{ secrets.ANNOUNCE_KIMI_TOP_N }}
          
        run: |
          echo "当前工作目录: $(pwd)"
          node run.js 
          if [ -f "extern_user.txt" ]; then
            echo "✅ extern_user.txt 文件生成成功"
          else
            echo "❌ 文件生成失败！"
            ls -la
            exit 1
          fi

      - name: 强力压缩并准备提交
        run: |
          # 使用gzip进行强力压缩 (-9 最大压缩比)
          gzip -9 -c extern_user.txt > extern_user.txt.gz
          
          # 验证压缩文件
          if [ -f "extern_user.txt.gz" ]; then
            echo "✅ 压缩完成 - 原始大小: $(du -h extern_user.txt | cut -f1)"
            echo "  压缩后大小: $(du -h extern_user.txt.gz | cut -f1)"
            
            # 删除原始文件
            rm extern_user.txt
          else
            echo "❌ 压缩失败！"
            exit 1
          fi

      - name: Commit files
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          
          # 添加压缩文件、公告缓存和package-lock.json
          git add extern_user.txt.gz
          git add extern_user_ann_cache.json
          git add package-lock.json
          
          # 检查是否有变化
          if git diff --staged --quiet; then
            echo "⚠️ 没有变化需要提交"
          else
            git commit -m "Auto-commit: 压缩的extr_user.txt.gz和package-lock.json [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push origin HEAD:${{ github.ref }}
          fi
          
          # 调试输出
          echo "提交文件状态:"
          git status --porcelain
          echo "最近一次提交:"
          git log -1 --oneline
